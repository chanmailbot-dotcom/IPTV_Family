# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx128m
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html
# org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable new composer compiler
kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# Version del proyecto: UNA sola fuente.
#
# Estaba en tres sitios (raiz de composeApp, packageVersion del instalador y
# versionName de Android) y ya habian divergido: 1.0.0 en dos de ellos y 1.0.3
# en el instalador. Con numeros distintos, un informe de fallo no dice nada,
# porque no se sabe a que version se refiere el usuario.
#
# OJO: Windows Installer solo actualiza en sitio si esta version SUBE; con la
# misma aborta con "Another version of this product is already installed".
# versionCode de Android se deriva de aqui (1.0.3 -> 10003).
# ---------------------------------------------------------------------------
iptvFamilyVersion=1.0.3
