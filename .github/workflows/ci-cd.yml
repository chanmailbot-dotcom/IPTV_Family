# IPTV Family - CI/CD
#
# El instalador de Windows NO se puede construir en Linux: jpackage no cross-compila
# y el MSI necesita Windows + WiX. De ahi el job en windows-latest.
#
# El modulo :app (Android) esta desactivado en settings.gradle.kts mientras se
# termina el escritorio; sus jobs vuelven con el trabajo de Fire TV / Android TV.
name: CI/CD

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  test:
    name: Tests y analisis estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del modulo compartido
        run: ./gradlew :shared:desktopTest

      - name: Tests del escritorio
        run: ./gradlew :composeApp:desktopTest

      - name: Informes de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            composeApp/build/reports/tests/
          retention-days: 7

  windows:
    name: Instalador Windows (MSI + EXE)
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # jpackage solo admite WiX 3.x para generar MSI/EXE (WiX 4+ no sirve).
      # windows-latest ya lo trae, asi que solo hay que ponerlo en el PATH.
      - name: Preparar WiX Toolset v3
        shell: pwsh
        run: |
          function Find-Candle {
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin\candle.exe" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          $candle = Find-Candle
          if (-not $candle) {
            Write-Host "WiX 3 no encontrado en el runner; instalando con Chocolatey."
            choco install wixtoolset --no-progress -y
            $candle = Find-Candle
          }
          if (-not $candle) { throw "No se pudo obtener WiX 3 (candle.exe): jpackage no podra generar el MSI." }

          $bin = Split-Path $candle -Parent
          Write-Host "WiX 3 en $bin"
          & $candle -? | Select-Object -First 2
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # Mete libvlc en composeApp/resources/windows-x64/vlc para que viaje dentro
      # del instalador y el usuario no tenga que instalar VLC aparte.
      - name: Descargar runtime de VLC
        run: .\scripts\fetch-vlc.ps1

      - name: Construir MSI y EXE
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe --no-daemon

      - name: Localizar instaladores
        id: find
        shell: pwsh
        run: |
          $dir = "composeApp\build\compose\binaries\main"
          Get-ChildItem -Path $dir -Recurse -Include *.msi,*.exe | ForEach-Object {
            Write-Host "$($_.FullName)  ($([math]::Round($_.Length/1MB,1)) MB)"
          }

      - name: Subir MSI
        uses: actions/upload-artifact@v4
        with:
          name: iptv-family-windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: iptv-family-windows-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: iptv-family-windows-*
          merge-multiple: true
          path: release

      - name: Listar lo que se publica
        run: ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: IPTV Family ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            ## Instalar en Windows

            Descarga el **.msi** y ejecutalo. No pide permisos de administrador y
            trae el motor de video incluido: no hace falta instalar VLC.

            Al abrirlo: **Mis listas -> Anadir lista**, mete tu URL `.m3u` o tus
            datos de Xtream Codes (URL del panel + usuario + contrasena), y a ver la tele.

            Si oyes el canal pero la imagen sale en negro, activa
            **Ajustes -> Modo compatibilidad de video**.

            ### Cambios
            ${{ github.event.head_commit.message }}
          files: release/*
          draft: false
          prerelease: false
