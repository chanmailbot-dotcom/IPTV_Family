# IPTV Family - CI/CD
#
# El instalador de Windows NO se puede construir en Linux: jpackage no cross-compila
# y el MSI necesita Windows + WiX. De ahi el job en windows-latest.
#
# El modulo :app (Android / Fire TV) SI esta en el build y se compila aqui. El
# APK se firma solo si el proyecto tiene configurados los secretos de firma; sin
# ellos se sube el de depuracion, marcado como tal.
name: CI/CD

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  test:
    name: Tests y analisis estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del modulo compartido
        run: ./gradlew :shared:desktopTest

      - name: Tests del escritorio
        run: ./gradlew :composeApp:desktopTest

      # El job se llamaba "Tests y analisis estatico" y solo ejecutaba tests:
      # detekt estaba declarado en el build y no se aplicaba en ningun modulo.
      # Dos mitades: la logica (shared + escritorio) se analiza CON resolucion de
      # tipos; la interfaz de Android, sin ella (su classpath es otro, y dandole
      # el de la JVM detekt concluye mal: ver el comentario en build.gradle.kts).
      - name: Analisis estatico (detekt)
        run: ./gradlew analisisEstatico

      - name: Informe de detekt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7

      - name: Informes de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            composeApp/build/reports/tests/
          retention-days: 7

  android:
    name: APK (Android / Fire TV)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Los secretos solo existen si el dueño del repositorio los ha creado. Sin
      # ellos se sigue adelante con el APK de depuracion en vez de romper el
      # build: quien clone el proyecto tiene que poder construirlo.
      - name: Preparar clave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "disponible=si" >> "$GITHUB_OUTPUT"
            echo "Clave de firma disponible: se construye un APK de release firmado."
          else
            echo "disponible=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin secretos de firma: se sube el APK de DEPURACION, no repartible."
          fi

      - name: Construir APK de release firmado
        if: steps.firma.outputs.disponible == 'si'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/firma.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Construir APK de depuracion
        if: steps.firma.outputs.disponible == 'no'
        run: ./gradlew :app:assembleDebug

      - name: Comprobar que el APK esta firmado
        if: steps.firma.outputs.disponible == 'si'
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verificando $APK"
          # apksigner viene con las build-tools del SDK del runner.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-family-android-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Instalador Windows (MSI + EXE)
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # jpackage solo admite WiX 3.x para generar MSI/EXE (WiX 4+ no sirve).
      # windows-latest ya lo trae, asi que solo hay que ponerlo en el PATH.
      - name: Preparar WiX Toolset v3
        shell: pwsh
        run: |
          function Find-Candle {
            Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin\candle.exe" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          $candle = Find-Candle
          if (-not $candle) {
            Write-Host "WiX 3 no encontrado en el runner; instalando con Chocolatey."
            choco install wixtoolset --no-progress -y
            $candle = Find-Candle
          }
          if (-not $candle) { throw "No se pudo obtener WiX 3 (candle.exe): jpackage no podra generar el MSI." }

          $bin = Split-Path $candle -Parent
          Write-Host "WiX 3 en $bin"
          & $candle -? | Select-Object -First 2
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # Mete libvlc en composeApp/resources/windows-x64/vlc para que viaje dentro
      # del instalador y el usuario no tenga que instalar VLC aparte.
      - name: Descargar runtime de VLC
        run: .\scripts\fetch-vlc.ps1

      - name: Construir MSI y EXE
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe --no-daemon

      - name: Localizar instaladores
        id: find
        shell: pwsh
        run: |
          $dir = "composeApp\build\compose\binaries\main"
          Get-ChildItem -Path $dir -Recurse -Include *.msi,*.exe | ForEach-Object {
            Write-Host "$($_.FullName)  ($([math]::Round($_.Length/1MB,1)) MB)"
          }

      - name: Subir MSI
        uses: actions/upload-artifact@v4
        with:
          name: iptv-family-windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: iptv-family-windows-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [windows, android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: iptv-family-*
          merge-multiple: true
          path: release

      - name: Listar lo que se publica
        run: ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: IPTV Family ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            ## Instalar en Windows

            Descarga el **.msi** y ejecutalo. No pide permisos de administrador y
            trae el motor de video incluido: no hace falta instalar VLC.

            Al abrirlo: **Mis listas -> Anadir lista**, mete tu URL `.m3u` o tus
            datos de Xtream Codes (URL del panel + usuario + contrasena), y a ver la tele.

            Si oyes el canal pero la imagen sale en negro, activa
            **Ajustes -> Modo compatibilidad de video**.

            ## Instalar en Android TV / Fire TV

            Descarga el **.apk**. Si el nombre lleva `debug`, es una version de
            pruebas firmada con una clave de desarrollo.

            ### Cambios
            ${{ github.event.head_commit.message }}

            ---

            **Esta aplicacion no incluye ningun contenido, ni canales, ni
            listas.** Hace falta tu propia lista M3U o las credenciales del
            proveedor que hayas contratado.

            **Licencias.** El codigo de IPTV Family es MIT. El instalador de
            Windows incluye ademas el motor de video **VLC** (VideoLAN), con
            licencia LGPL v2.1+ y, en algunos plugins, GPL v2+: por eso el
            paquete `.msi` se distribuye bajo GPL v2 o posterior. Detalles,
            textos de licencia y enlace al codigo fuente de VLC en
            [LICENSES-TERCEROS.md](https://github.com/chanmailbot-dotcom/IPTV_Family/blob/master/LICENSES-TERCEROS.md).
            El `.apk` usa Media3/ExoPlayer, no VLC, y va bajo MIT.

            VLC y VideoLAN son marcas de VideoLAN. Este proyecto no esta
            asociado a VideoLAN ni respaldado por ella.
          files: release/*
          draft: false
          prerelease: false
